spring:
  application:
    name: workout-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_workout_db
    username: postgres
    password: pass123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-api-key-here}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.fitness.workoutservice: DEBUG
