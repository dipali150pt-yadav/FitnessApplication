spring:
  application:
    name: activity-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_activity_db?createDatabaseIfNotExist=true
    username: root
    password: pass123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness-exchange
  queue:
    activity: activity-queue
  routing-key:
    activity: activity.created

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.fitness.activityservice: DEBUG
